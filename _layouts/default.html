<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ page.title | default: site.title }}</title>

    <style>
        body {
            margin: 0;
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.6;
        }

        main {
            max-width: 980px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        h1, h2, h3, h4 {
            color: #f0f6fc;
        }

        a {
            color: #58a6ff;
        }

        code {
            background: #161b22;
            padding: 2px 6px;
            border-radius: 6px;
        }

        pre {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 16px;
            overflow-x: auto;
            border-radius: 6px;
        }

        img {
            max-width: 100%;
        }

        hr {
            border: 0;
            border-top: 1px solid #30363d;
        }
    </style>
</head>

<body>
<main>
    {{ content }}
</main>
</body>
</html>
